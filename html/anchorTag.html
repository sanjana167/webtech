<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anchor tags</title>
  </head>
  <body>
    <h1>Learn Anchor Tag</h1>
    <a href="https://www.flipcart.com">flipcart</a>

    <br />

    <a href="./index.html">index</a>
    <hr />

    <!--* open in same tab-->
    <a href="./index.html" target="_self">index page in same tab</a>

    <br />

    <!--* open in new tab -->
    <a href="./index.html" target="_blank">index page in new tab</a>

    <br />

    <!--* iframe  Nested webpage -->
    <iframe src="./child1.html" frameborder="1" height="250" width="300"></iframe>

    <hr>

  <a href="tel:0000000000">0000000000</a>

  <br>

  <a href="mailto:abc@gmail.com">abc@gmil.com</a>

  </body>
</html>
