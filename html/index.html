    <!--!   combinations of opening and closing tag with content
     ex- <h1> text<h1/>

      => there are 3 types of element
       1) block element
       - it tasks full width of viewport
       - it accepts height and width property
       -ex:- heading tags, div tags,form tags, paragraph, table.......

       2) inline element
       - it take only content width
       - it do not accept height and width property
       - ex:- strong, em, ims, del,span,

       3)inline-block elememt
       - it take only content width
       - it accepts height and width property
       - ex:- img tag,iframe tag, vedio tag ,canvas........
       -->

       <div style="background-color: aqua;height: 100px;"> BLOCK ELEMENT</div>


       <span style="background-color: rgb(25, 245, 55); height: 100px;"> INLINE ELEMENT</span>
