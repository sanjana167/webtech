<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h1>Lean List in HTML</h1>

    <!-- ordered list  (Block element) -->
    <ol type="1" start="27"  reversed >
        <li>Frontend</li>
        <li>Middleware</li>
        <li>Database</li>
    </ol>

    <!-- unordered list  (Block element)-->
     <ul type="circle">
        <li>Frontend</li>
        <li>Middleware</li>
        <li>Database</li>
     </ul>

     <!-- description/defination list (block element) -->
      <dl>
        <dt>descriptionTerm</dt>
        <dd>description defination/Data</dd>
      </dl>


</body>
</html>
